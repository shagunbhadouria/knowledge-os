services:
  omnirag-api:
    image: omnirag-api:dev
    build:
      context: .
      target: development
    container_name: omnirag-api
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/omnirag?replicaSet=rs0&directConnection=true}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-omnirag_password}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      GROQ_API_KEY: ${GROQ_API_KEY:-gsk_replace_me}
      GROQ_MODEL_FAST: ${GROQ_MODEL_FAST:-llama-3.1-8b-instant}
      GROQ_MODEL_SMART: ${GROQ_MODEL_SMART:-llama-3.1-70b-versatile}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-replace-me.apps.googleusercontent.com}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-replace-me}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-replace-me}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-replace-me}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-replace-with-random-32-char-string}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-replace-me}
      ENTITY_MERGE_THRESHOLD: ${ENTITY_MERGE_THRESHOLD:-0.85}
      GRAPH_EXPANSION_HOPS: ${GRAPH_EXPANSION_HOPS:-2}
      KTD_INACTIVITY_DAYS: ${KTD_INACTIVITY_DAYS:-14}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PORT: ${PORT:-3001}
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "3001:3001"
    volumes:
      - .:/app
    depends_on:
      mongodb:
        condition: service_healthy
      mongot:
        condition: service_started
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started

  mongodb:
    # Blueprint 2.2 originally locked mongo:7 (Atlas Vector Search
    # only, cloud-only). Upgraded to MongoDB Community Edition 8.2+
    # (Decision Log, Phase 3) which added local $vectorSearch support
    # via a separate mongot sidecar - no Atlas account needed. Vector
    # search requires MongoDB to run as a replica set even single-node
    # (--replSet), which is why `command` and the healthcheck below
    # are new versus the plain mongo:7 setup this replaces.
    image: mongodb/mongodb-community-server:8.2-ubi8-slim
    container_name: omnirag-mongodb
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--setParameter", "searchIndexManagementHostAndPort=mongot:27028"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval
        "try { rs.status().ok } catch (e) { rs.initiate().ok }"
      interval: 5s
      timeout: 5s
      retries: 20

  mongot:
    # The mongot sidecar handles $search/$vectorSearch indexing and
    # query execution; mongod stores the actual documents. They talk
    # over the network — this container has no volume of its own for
    # application data, only its own search-index state.
    image: mongodb/mongodb-community-search:0.64.0
    container_name: omnirag-mongot
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "27028:27028"
    volumes:
      - mongot_data:/data
    command: ["--mongodHostAndPort", "mongodb:27017"]

  neo4j:
    image: neo4j:4.4
    container_name: omnirag-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-omnirag_password}
      NEO4JLABS_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      # Rule R-89 applies to the container level too, not just
      # GET /health: a container that "looks up" before it can accept
      # Bolt connections is exactly the race this healthcheck exists
      # to close. cypher-shell ships in the neo4j:4.4 image itself, so
      # no extra tooling is needed inside the container.
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-omnirag_password} 'RETURN 1' || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7
    container_name: omnirag-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: omnirag-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  mongodb_data:
  mongot_data:
  neo4j_data:
  neo4j_logs:
  ollama_data:
