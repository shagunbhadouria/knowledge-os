services:
  omnirag-api:
    image: omnirag-api:dev
    build:
      context: .
      target: development
    container_name: omnirag-api
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/omnirag?directConnection=true}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-omnirag_password}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      GROQ_API_KEY: ${GROQ_API_KEY:-gsk_replace_me}
      GROQ_MODEL_FAST: ${GROQ_MODEL_FAST:-llama-3.1-8b-instant}
      GROQ_MODEL_SMART: ${GROQ_MODEL_SMART:-llama-3.1-70b-versatile}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-replace-me.apps.googleusercontent.com}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-replace-me}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-replace-me}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-replace-me}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-replace-with-random-32-char-string}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-replace-me}
      ENTITY_MERGE_THRESHOLD: ${ENTITY_MERGE_THRESHOLD:-0.85}
      GRAPH_EXPANSION_HOPS: ${GRAPH_EXPANSION_HOPS:-2}
      KTD_INACTIVITY_DAYS: ${KTD_INACTIVITY_DAYS:-14}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PORT: ${PORT:-3001}
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "3001:3001"
    volumes:
      - .:/app
    depends_on:
      mongodb:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started

  mongodb:
    # DECISION LOG UPDATE (post-Phase-3 local testing): the original
    # two-container wiring (mongodb-community-server + a standalone
    # mongodb-community-search sidecar, manually pointed at each other
    # via --setParameter searchIndexManagementHostAndPort) is not the
    # pattern MongoDB documents for local dev, and it never got an
    # auth user configured between mongod and mongot. It failed at
    # the mongot binary/startup stage before that gap even mattered.
    # Replaced with mongodb/mongodb-atlas-local, MongoDB's own
    # single-container image that bundles mongod + mongot + the
    # runner process that wires them together — same $vectorSearch
    # capability, no manual sync-source or credential wiring needed.
    # This is a deviation from Blueprint 2.2/2.3's locked stack line
    # ("MongoDB Atlas Vector Search... Community 8.2 local sidecar")
    # — log this in the Blueprint Decision Register per Rule R-68.
    image: mongodb/mongodb-atlas-local:latest
    container_name: omnirag-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  neo4j:
    image: neo4j:4.4
    container_name: omnirag-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-omnirag_password}
      NEO4JLABS_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-omnirag_password} 'RETURN 1' || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7
    container_name: omnirag-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: omnirag-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  mongodb_data:
  neo4j_data:
  neo4j_logs:
  ollama_data: