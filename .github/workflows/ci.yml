name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check app tests conftest.py

      - name: Ruff format check
        run: ruff format --check app tests conftest.py

      - name: Mypy strict compile
        run: mypy app

      - name: Pytest
        run: pytest -m "not integration"

      - name: pip-audit (Blueprint 2.5 A06 / Phase 11 exit criterion)
        run: |
          pip-audit -r requirements.txt
          pip-audit -r requirements-dev.txt

  integration-tests:
    needs: quality-gate
    runs-on: ubuntu-latest

    services:
      # Matches docker-compose.yml exactly (Phase 3 mongot fix):
      # mongodb-atlas-local bundles mongod + mongot in one image, so
      # CI now genuinely tests Atlas Vector Search wiring instead of
      # silently skipping it the way mongo:7 did. Health check mirrors
      # docker-compose.yml's mongodb service check verbatim so both
      # environments assert identical readiness semantics.
      #
      # History: a Feb 2025 mongodb-atlas-local image push briefly
      # broke `services:` compatibility (container reported
      # "unhealthy" indefinitely in GitHub Actions specifically —
      # worked fine in Docker Compose). MongoDB confirmed and fixed it
      # same day; current images work as a plain services: container
      # with just image/ports/health-cmd, same shape as any other.
      # Ref: mongodb.com/community/forums/t/mongodb-mongodb-atlas-local-not-working-in-github-actions/311906
      mongo:
        image: mongodb/mongodb-atlas-local:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping').ok\""
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 20s

      neo4j:
        image: neo4j:4.4
        env:
          NEO4J_AUTH: neo4j/test-password
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "cypher-shell -u neo4j -p test-password 'RETURN 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      env:
        MONGODB_URI: mongodb://localhost:27017/omnirag_test
        NEO4J_URI: bolt://localhost:7687
        NEO4J_USERNAME: neo4j
        NEO4J_PASSWORD: test-password
        REDIS_URL: redis://localhost:6379/0
        GROQ_API_KEY: gsk_test_placeholder
        GROQ_MODEL_FAST: llama-3.1-8b-instant
        GROQ_MODEL_SMART: llama-3.1-70b-versatile
        OLLAMA_BASE_URL: http://localhost:11434
        GOOGLE_CLIENT_ID: test.apps.googleusercontent.com
        GOOGLE_CLIENT_SECRET: test-secret
        JWT_PRIVATE_KEY: test-key
        JWT_PUBLIC_KEY: test-key
        GITHUB_WEBHOOK_SECRET: test-webhook-secret
        SLACK_SIGNING_SECRET: test-slack-secret
        ENTITY_MERGE_THRESHOLD: "0.85"
        GRAPH_EXPANSION_HOPS: "2"
        KTD_INACTIVITY_DAYS: "14"
        FRONTEND_URL: http://localhost:3000
        LOG_LEVEL: INFO
        PORT: "3001"
        NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Wait for service containers
        run: |
          until (echo > /dev/tcp/localhost/27017) 2>/dev/null; do sleep 1; done
          until (echo > /dev/tcp/localhost/7687) 2>/dev/null; do sleep 1; done
          until (echo > /dev/tcp/localhost/6379) 2>/dev/null; do sleep 1; done

      # Provisions the same infra `make migrate` provisions locally
      # (Neo4j schema/indexes, Mongo Atlas Vector Search index, Redis
      # Streams consumer group + dead-letter stream) before any test
      # runs against these fresh service containers. Without this,
      # `pytest -m integration` was passing only because each affected
      # test class happened to call apply_schema()/
      # ensure_vector_search_index() on itself first -- true for
      # those two, but there was no equivalent integration test (and
      # therefore no equivalent self-provisioning) for ensure_streams()
      # at all. This step makes the guarantee explicit and complete
      # instead of incidental.
      - name: Provision infra (schema, vector index, streams)
        run: |
          python -c "
          import asyncio
          from app.database.schema import apply_schema
          from app.database.mongodb import ensure_vector_search_index
          from app.database.redis import ensure_streams

          async def main() -> None:
              await apply_schema()
              await ensure_vector_search_index()
              await ensure_streams()

          asyncio.run(main())
          "

      - name: Pytest (integration)
        run: pytest -m integration

      - name: Verify /health returns 200
        run: |
          pip install httpx
          python -c "
          import asyncio
          from httpx import ASGITransport, AsyncClient
          from app.main import create_app

          async def main() -> None:
              transport = ASGITransport(app=create_app())
              async with AsyncClient(transport=transport, base_url='http://test') as client:
                  response = await client.get('/api/v1/health')
                  assert response.status_code == 200, response.text
                  print(response.json())

          asyncio.run(main())
          "